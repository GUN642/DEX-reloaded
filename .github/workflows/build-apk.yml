name: Build APK

on:
  push:
    # Release nur von main. Andere Branches werden nur gebaut (Kontrolle, Artefakt).
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version lesen
        id: version
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($CODE)"

      - name: Keystore aus Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt. Ohne feste Signatur wird kein Release gebaut."
            exit 1
          else
            echo "::warning::Kein Keystore. Testbau mit Debug-Signatur."
          fi

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DEX-reloaded.apk

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DEX-reloaded-${{ steps.version.outputs.name }}
          path: DEX-reloaded.apk

      - name: Release erstellen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: DEX reloaded ${{ steps.version.outputs.name }}
          body: "Version ${{ steps.version.outputs.name }} (Build ${{ steps.version.outputs.code }}), Commit ${{ github.sha }}"
          files: DEX-reloaded.apk
          make_latest: true
